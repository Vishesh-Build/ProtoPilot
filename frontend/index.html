<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>ProtoPilot</title>

    <!--
      Inter, loaded so it can NEVER block first paint or hang the
      app when there is no network (packaged Electron, or a venue
      with dead wifi): the stylesheet is fetched as `print` media
      and promoted to `all` only once it has actually loaded.
      If it never loads, src/global.css falls back to Segoe UI.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body style="margin: 0; padding: 0; background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; overflow-x: hidden;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 14px; user-select: none;">
        <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #4F46E5, #06B6D4); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 28px rgba(79, 70, 229, 0.45);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div style="font-size: 19px; font-weight: 600; letter-spacing: -0.02em; color: #ffffff;">ProtoPilot</div>
        <div style="font-size: 13px; color: #9ca3af; display: flex; align-items: center; gap: 8px;">
          <span>Launching workspace...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
