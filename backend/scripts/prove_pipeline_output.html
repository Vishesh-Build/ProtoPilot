<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FoodieGo – Order & Track Your Favorite Meals</title>
<style>
:root{
  --bg:#f9fafb;
  --card:#fff;
  --accent:#ff6b6b;
  --accent-dark:#ff4e4e;
  --text:#333;
  --subtext:#666;
  --border:#e0e0e0;
  --radius:12px;
  --shadow:0 2px 8px rgba(0,0,0,0.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;}
header{background:var(--card);padding:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:10;}
header .location{background:#f0f0f0;border-radius:999px;padding:6px 12px;cursor:pointer;}
header .search{flex:1;margin:0 12px;}
header .search input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:#fafafa;}
header .profile{width:32px;height:32px;border-radius:50%;background:#ccc;}
main{max-width:480px;margin:auto;padding:16px;}
section{display:none;}
section.active{display:block;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.card img{width:100%;height:180px;object-fit:cover;}
.card-content{padding:12px;}
.card-title{font-weight:bold;font-size:1.1rem;margin-bottom:4px;}
.card-meta{font-size:.9rem;color:var(--subtext);display:flex;gap:8px;flex-wrap:wrap;}
.badge{background:#e0e0e0;color:#555;font-size:.75rem;padding:2px 6px;border-radius:999px;}
.badge.green{background:#e0f8e0;color:#2d7a2d;}
.badge.gray{background:#f0f0f0;color:#777;}
.badge.star{background:#ffe58f;color:#c48e00;}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;}
.chip{background:#f0f0f0;color:#555;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--accent);color:#fff;}
.banner{background:var(--accent);color:#fff;padding:12px;border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.banner button{background:#fff;color:var(--accent);border:none;padding:6px 12px;border-radius:999px;cursor:pointer;}
.menu-header{display:flex;align-items:center;gap:8px;}
.menu-header button{background:none;border:none;font-size:1.2rem;cursor:pointer;}
.menu-tabs{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto;}
.menu-tabs button{background:#f0f0f0;border:none;padding:6px 12px;border-radius:999px;cursor:pointer;}
.menu-tabs button.active{background:var(--accent);color:#fff;}
.menu-item{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--border);}
.menu-item img{width:80px;height:80px;border-radius:8px;object-fit:cover;}
.menu-item-details{flex:1;}
.menu-item-name{font-weight:bold;margin-bottom:4px;}
.menu-item-desc{font-size:.9rem;color:var(--subtext);margin-bottom:4px;}
.menu-item-price{font-weight:bold;}
.menu-item-availability{font-size:.8rem;color:var(--subtext);}
.menu-item-add{display:flex;align-items:center;gap:4px;}
.menu-item-add button{background:var(--accent);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:1.2rem;cursor:pointer;}
.menu-item-add button:disabled{background:#ccc;cursor:not-allowed;}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);padding:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
.cart-bar button{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:999px;cursor:pointer;}
.cart-bar span{font-weight:bold;}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);}
.cart-item img{width:60px;height:60px;border-radius:8px;object-fit:cover;}
.cart-item-details{flex:1;}
.cart-item-name{font-weight:bold;margin-bottom:4px;}
.cart-item-custom{font-size:.9rem;color:var(--subtext);}
.cart-item-qty{display:flex;align-items:center;gap:4px;}
.cart-item-qty button{background:#f0f0f0;border:none;width:24px;height:24px;border-radius:50%;font-size:1rem;cursor:pointer;}
.cart-item-qty span{min-width:16px;text-align:center;}
.cart-item-price{font-weight:bold;}
.cart-item-remove{background:none;border:none;font-size:1.2rem;color:#999;cursor:pointer;}
.cart-summary{background:var(--card);padding:12px;border-radius:var(--radius);box-shadow:var(--shadow);margin-top:12px;}
.cart-summary h3{margin-bottom:8px;}
.cart-summary div{display:flex;justify-content:space-between;margin-bottom:4px;}
.cart-summary .total{font-weight:bold;font-size:1.1rem;}
.payment-method{display:flex;gap:12px;margin-top:12px;}
.payment-method label{display:flex;align-items:center;gap:4px;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:8px 16px;border-radius:999px;animation:fadein 0.3s;}
@keyframes fadein{0%{opacity:0;}100%{opacity:1;}}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;}
.modal-content{background:var(--card);width:100%;max-height:80%;border-top-left-radius:16px;border-top-right-radius:16px;overflow-y:auto;padding:16px;}
.modal-close{position:absolute;top:8px;right:16px;font-size:1.5rem;color:#999;cursor:pointer;}
.map-placeholder{background:#e0e0e0;height:200px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#777;}
</style>
</head>

<header>
  <div class="location" id="location-selector">Deliver to: Home</div>
  <div class="search"><input type="text" id="search-input" placeholder="Search for restaurants or dishes"></div>
  <div class="profile"></div>
</header>
<main id="app-main">
  <!-- Home Screen -->
  <section id="home-screen" class="active">
    <div class="chips" id="category-chips"></div>
    <div id="restaurant-list"></div>
    <div class="banner">
      <span>Get 20% off your first
<script>
(function () {
  function alreadyHandled(el) {
    if (el.hasAttribute('onclick')) return true;
    if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href') !== '#') return true;
    if (el.tagName === 'BUTTON' && el.type === 'submit') return true;
    return false;
  }
  function showPing(el) {
    var ping = document.createElement('div');
    ping.textContent = '\u2713';
    ping.style.cssText = 'position:absolute;pointer-events:none;font-size:11px;' +
      'color:#00E6A8;font-weight:700;opacity:0;transition:opacity .15s,transform .4s;' +
      'transform:translateY(0);z-index:99999;';
    var rect = el.getBoundingClientRect();
    ping.style.left = (rect.right - 14 + window.scrollX) + 'px';
    ping.style.top = (rect.top - 6 + window.scrollY) + 'px';
    document.body.appendChild(ping);
    requestAnimationFrame(function () { ping.style.opacity = '1'; });
    setTimeout(function () {
      ping.style.opacity = '0';
      ping.style.transform = 'translateY(-10px)';
    }, 400);
    setTimeout(function () { ping.remove(); }, 800);
    el.style.transition = el.style.transition || 'transform .12s';
    var prevTransform = el.style.transform;
    el.style.transform = 'scale(0.97)';
    setTimeout(function () { el.style.transform = prevTransform || ''; }, 120);
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('button, a, [role="button"], [data-clickable]');
    if (!el || alreadyHandled(el)) return;
    showPing(el);
  }, true);
})();
</script>
